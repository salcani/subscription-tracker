
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>Subscription Tracker</h1>
        <p>Manage and keep track of your subscriptions.</p>
    </header>

    <main>

        <!-- Add Subscription Section -->
        <section id="subscription-form-section">
            <h2>Add a Subscription</h2>

            <form id="subscription-form">

                <div>
                    <label for="service">Service:</label>
                    <input type="text" id="service" name="service"
                           placeholder="e.g. Netflix" required>
                </div>

                <div>
                    <label for="provider">Provider:</label>
                    <input type="text" id="provider" name="provider"
                           placeholder="e.g. Netflix Inc." required>
                </div>

                <div>
                    <label for="subscriber">Subscriber:</label>
                    <input type="text" id="subscriber" name="subscriber"
                           placeholder="e.g. John Smith" required>
                </div>

                <div>
                    <label for="renewal-date">Renewal Date:</label>
                    <input type="date" id="renewal-date"
                           name="renewal-date" required>
                </div>

                <div>
                    <label for="category">Category:</label>
                    <select id="category" name="category" required>
                        <option value="">Select a category</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Music">Music</option>
                        <option value="Software">Software</option>
                        <option value="Education">Education</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <button type="submit">Add Subscription</button>

            </form>
        </section>

        <!-- Subscription Table Section -->
        <section id="subscriptions-section">
            <h2>My Subscriptions</h2>

            <table>
                <thead>
                    <tr>
                        <th>Service</th>
                        <th>Provider</th>
                        <th>Subscriber</th>
                        <th>Renewal Date</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="subscription-list">
                    <!-- JavaScript will add subscriptions here -->
                </tbody>
            </table>
        </section>

        <!-- Summary Section -->
        <section id="summary-section">
            <h2>Subscription Summary</h2>

            <div>
                <h3>Total Subscriptions</h3>
                <p id="total-subscriptions">0</p>
            </div>

            <div>
                <h3>Expired Subscriptions</h3>
                <p id="expired-subscriptions">0</p>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
