
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header Section -->
    <header class="page-header">
        <h1>Subscription Tracker</h1>
        <p>Manage and keep track of your subscriptions.</p>
    </header>

    <main class="container">

        <!-- Add Subscription Section -->
        <section id="subscription-form-section" class="section">
            <h2 class="section-title">Add a Subscription</h2>

            <form id="subscription-form" class="form-grid">

                <div class="form-group">
                    <label for="service">Service:</label>
                    <input type="text" id="service" name="service"
                           class="form-control"
                           placeholder="e.g. Netflix" required>
                </div>

                <div class="form-group">
                    <label for="provider">Provider:</label>
                    <input type="text" id="provider" name="provider"
                           class="form-control"
                           placeholder="e.g. Netflix Inc." required>
                </div>

                <div class="form-group">
                    <label for="subscriber">Subscriber:</label>
                    <input type="text" id="subscriber" name="subscriber"
                           class="form-control"
                           placeholder="e.g. John Smith" required>
                </div>

                <div class="form-group">
                    <label for="renewal-date">Renewal Date:</label>
                    <input type="date" id="renewal-date"
                           name="renewal-date"
                           class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="category">Category:</label>
                    <select id="category" name="category"
                            class="form-control" required>
                        <option value="">Select a category</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Music">Music</option>
                        <option value="Software">Software</option>
                        <option value="Education">Education</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <button type="submit" class="button button-primary">
                        Add Subscription
                    </button>
                </div>

            </form>
        </section>

        <!-- Subscription Table Section -->
        <section id="subscriptions-section" class="section">
            <h2 class="section-title">My Subscriptions</h2>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Service</th>
                            <th>Provider</th>
                            <th>Subscriber</th>
                            <th>Renewal Date</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="subscription-list">
                        <!-- JavaScript will add subscriptions here -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Summary Section -->
        <section id="summary-section" class="section">
            <h2 class="section-title">Subscription Summary</h2>

            <div class="summary-grid">

                <div class="summary-card">
                    <h3>Total Subscriptions</h3>
                    <p id="total-subscriptions" class="summary-number">0</p>
                </div>

                <div class="summary-card">
                    <h3>Expired Subscriptions</h3>
                    <p id="expired-subscriptions" class="summary-number">0</p>
                </div>

            </div>
        </section>

    </main>
<script src="js-library.js"></script>
<script src="app.js"></script>
</body>
</html>
