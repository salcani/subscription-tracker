
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Tracker - Add</title>
    <link rel="stylesheet" href="css-library/styles.css">
</head>
<body>

    <!-- Header -->
    <header class="page-header">
        <h1>Subscription Tracker</h1>
        <p>Manage and keep track of your subscriptions.</p>
    </header>

    <!-- Navigation Menu -->
    <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="add.html" class="active">Add</a>
        <a href="subscriptions.html">Subscriptions</a>
    </nav>

    <main class="container">

        <!-- Add Subscription Section -->
        <section class="section">
            <h2 class="section-title">Add a New Subscription</h2>

            <form id="subscription-form" class="form-grid">

                <div class="form-group">
                    <label for="service">Service:</label>
                    <input type="text" id="service" name="service"
                           class="form-control"
                           placeholder="e.g. Netflix" required>
                </div>

                <div class="form-group">
                    <label for="provider">Provider:</label>
                    <input type="text" id="provider" name="provider"
                           class="form-control"
                           placeholder="e.g. Netflix Inc." required>
                </div>

                <div class="form-group">
                    <label for="subscriber">Subscriber:</label>
                    <input type="text" id="subscriber" name="subscriber"
                           class="form-control"
                           placeholder="e.g. Sara" required>
                </div>

                <div class="form-group">
                    <label for="renewal-date">Renewal Date:</label>
                    <input type="date" id="renewal-date"
                           name="renewal-date"
                           class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="category">Category:</label>
                    <select id="category" name="category"
                            class="form-control" required>
                        <option value="">Select a category</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Music">Music</option>
                        <option value="Software">Software</option>
                        <option value="Education">Education</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <button type="submit" class="button button-primary">
                        Add Subscription
                    </button>
                </div>

            </form>
        </section>

    </main>
<script src="js-library/library.js"></script>
<script src="app.js"></script>

</body>
</html>
